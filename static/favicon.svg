<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="redGlow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0c0d12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 黑曜石圓角底板 -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="#0c0d12"/>
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#redGlow)"/>

  <!-- 量化微格線 -->
  <path d="M160 80v352 M260 80v352 M360 80v352 M80 160h352 M80 260h352 M80 360h352" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- 多頭連三紅 K 棒柱群 -->
  <path d="M170 250v120 M170 280h24v60h-24z" fill="#ef4444" fill-opacity="0.65" stroke="#ef4444" stroke-width="4"/>
  <path d="M240 210v120 M240 235h24v75h-24z" fill="#ef4444" fill-opacity="0.85" stroke="#ef4444" stroke-width="4"/>
  <path d="M310 150v140 M310 175h24v95h-24z" fill="#f43f5e" stroke="#f43f5e" stroke-width="4"/>

  <!-- Q 軌跡與赤紅金光突破雷射線 -->
  <path d="M120 370 q 60 0 100 -60 t 100 -90 l 80 -90" fill="none" stroke="url(#beamGrad)" stroke-width="8" filter="url(#neonRed)"/>
  <circle cx="145" cy="355" r="30" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="140 30" stroke-opacity="0.8"/>

  <!-- AI 琥珀金頂點 (Pulse Node) -->
  <circle cx="400" cy="130" r="24" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="400" cy="130" r="14" fill="#ef4444"/>
  <circle cx="400" cy="130" r="6" fill="#ffffff"/>
</svg>
